<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkillLoop - Next-Gen Student Ecosystem</title>
    <style>
        /* Futuristic Deep Black & Neon Blue Theme */
        :root {
            --bg-primary: #050508;
            --bg-secondary: #0b0e14;
            --bg-card: #111622;
            --accent-blue: #00d2ff;
            --accent-neon: #0072ff;
            --text-main: #f0f4f8;
            --text-muted: #8fa0b5;
            --border-glow: rgba(0, 210, 255, 0.15);
            --sidebar-width: 320px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            display: flex;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Sidebar - Gujarati Translation & Quick Navigation Options */
        .bilingual-sidebar {
            width: var(--sidebar-width);
            background-color: var(--bg-secondary);
            border-right: 1px solid rgba(0, 210, 255, 0.2);
            padding: 25px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            position: fixed;
            height: 100vh;
            overflow-y: auto;
            z-index: 10;
        }

        .sidebar-brand h2 {
            font-size: 24px;
            font-weight: 800;
            background: linear-gradient(135deg, #fff, var(--accent-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .sidebar-brand p {
            font-size: 11px;
            color: var(--text-muted);
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-top: 4px;
        }

        .lang-switch-box {
            background: rgba(0, 210, 255, 0.05);
            border: 1px dashed var(--accent-blue);
            padding: 15px;
            border-radius: 8px;
            margin-top: 10px;
        }

        .lang-switch-box h4 {
            font-size: 13px;
            color: var(--accent-blue);
            margin-bottom: 5px;
        }

        .lang-switch-box p {
            font-size: 12px;
            line-height: 1.4;
            color: var(--text-muted);
        }

        .nav-links {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 15px;
        }

        .nav-item {
            padding: 12px;
            background: transparent;
            border: 1px solid transparent;
            border-radius: 6px;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            text-align: left;
            transition: all 0.2s;
        }

        .nav-item:hover, .nav-item.active {
            background: rgba(0, 210, 255, 0.1);
            color: var(--accent-blue);
            border-color: rgba(0, 210, 255, 0.3);
            padding-left: 18px;
        }

        /* Main Workspace Content Section */
        .main-content {
            margin-left: var(--sidebar-width);
            flex: 1;
            padding: 40px;
            width: calc(100% - var(--sidebar-width));
        }

        /* Top Bar - Profile Metrics & Global Stats System */
        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            background: var(--bg-secondary);
            padding: 20px 30px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
        }

        .stats-cluster {
            display: flex;
            gap: 30px;
        }

        .stat-node {
            text-align: right;
        }

        .stat-node label {
            font-size: 11px;
            text-transform: uppercase;
            color: var(--text-muted);
            display: block;
            margin-bottom: 2px;
        }

        .stat-node span {
            font-size: 18px;
            font-weight: 700;
            color: var(--accent-blue);
        }

        /* Responsive Grids & Sections styling */
        .panel-section {
            margin-bottom: 50px;
        }

        .section-header {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 20px;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 10px;
            border-left: 4px solid var(--accent-blue);
            padding-left: 12px;
        }

        .app-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 25px;
        }

        /* Next Level Glassmorphic App Cards */
        .app-card {
            background-color: var(--bg-card);
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.03);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            position: relative;
        }

        .app-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 3px;
            background: linear-gradient(90deg, transparent, var(--accent-blue), transparent);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .app-card:hover {
            transform: translateY(-5px);
            border-color: rgba(0, 210, 255, 0.3);
            box-shadow: 0 12px 30px rgba(0, 210, 255, 0.1);
        }

        .app-card:hover::before {
            opacity: 1;
        }

        .card-inner {
            padding: 25px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .card-inner h3 {
            font-size: 18px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 10px;
        }

        .card-inner p {
            font-size: 13px;
            color: var(--text-muted);
            line-height: 1.6;
            margin-bottom: 18px;
            flex-1: 1;
        }

        .tech-pill-container {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 20px;
        }

        .tech-pill {
            background: rgba(255, 255, 255, 0.03);
            color: var(--accent-blue);
            font-size: 10px;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 20px;
            border: 1px solid rgba(0, 210, 255, 0.1);
            text-transform: uppercase;
        }

        /* Action & Execution Triggers */
        .action-trigger {
            background: linear-gradient(135deg, var(--accent-neon), #00a2ff);
            color: #fff;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 12px;
            cursor: pointer;
            width: 100%;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: filter 0.2s;
        }

        .action-trigger:hover {
            filter: brightness(1.1);
        }

        /* Collapsible Smart Control Blocks */
        .workspace-drawer {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 15px;
            margin-top: 15px;
            display: none;
        }

        .workspace-drawer input, .workspace-drawer textarea {
            width: 100%;
            background: var(--bg-primary);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            padding: 10px;
            border-radius: 6px;
            font-size: 12px;
            margin-bottom: 10px;
            outline: none;
        }

        .workspace-drawer input:focus, .workspace-drawer textarea:focus {
            border-color: var(--accent-blue);
        }

        /* Architecture, Model Framework & Pitch Decks Styling */
        .matrix-container {
            background: var(--bg-secondary);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 14px;
            padding: 30px;
        }

        .matrix-row {
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding: 15px 0;
            font-size: 13px;
        }

        .matrix-row:last-child {
            border-bottom: none;
        }

        .matrix-key {
            font-weight: 700;
            color: var(--accent-blue);
        }

        .matrix-value {
            color: var(--text-muted);
            text-align: right;
            max-width: 60%;
        }

        .speech-box {
            background: rgba(0, 210, 255, 0.02);
            border: 1px solid rgba(0, 210, 255, 0.1);
            border-radius: 8px;
            padding: 20px;
            color: var(--text-muted);
            font-size: 13px;
            line-height: 1.6;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-primary);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--bg-card);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent-blue);
        }
    </style>
</head>
<body>
